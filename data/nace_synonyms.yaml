# Everyday words for activities, for the intake picker's search only
# (app/matching/reference.py search_nace). Written by hand, unlike the other files here:
# НКД names an activity by what is produced («Производство на леб»), a person by who does
# it («пекар»). Found in DS4's timed intake: «пекар» found nothing.
#
# A word leads to the classes listed under it; the picker then shows НКД's own names, and
# a person picks one. Nothing here decides anything or is shown to a customer, so it does
# not change the reference-data version in reference.yaml.
#
# Adding a word: lower case, Macedonian Cyrillic, the shortest form people type (a search
# for «пекарница» also finds «пекар»'s entry, and «пека» finds «пекар»). Every code must
# exist in nace.csv as a class (four digits); tests/test_reference_data.py checks it.

