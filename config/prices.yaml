# Prices on /ceni (roadmap P3 s39). docs/decisions.md D1, decided by the user on 07.10.2026.
#
# Every amount is МКД without ДДВ; the page adds ДДВ and shows both, because a B2B buyer
# thinks without it and a farmer or an individual pays with it (D1). A change here is a
# price change and shows up in a diff, as a scoring weight does (CLAUDE.md).

vat_percent: 18

report:
  net: 8900
  # The founding price: the first ten orders, labelled as such and then gone. The order
  # service stops offering it once ten orders not cancelled have taken it
  # (app/orders/service.py); `open: false` ends it earlier.
  founding:
    net: 4900
    orders: 10
    open: true
  # Whether /naracka takes orders (P4 s50). A production deploy is still blocked until the
  # seller's details exist (`flask invoices check`, `flask legal check`).
  orderable: true
  # Working days from payment to the reviewed report, as the customer is told (the user's
  # decision of 13.10.2026). The analysis takes minutes; a person's review is the wait.
  delivery_working_days: 5

# A document package (roadmap P5 s75): the call's official forms filled with the company's
# data, the applicant's fields marked, the checklist, a person's review. Decided by the user
# on 16.10.2026: 2.900 МКД without ДДВ. Which calls have one is config/packages.yaml.
package:
  net: 2900
  # Whether packages can be ordered (P5 s75b: the review screen and delivery exist). A call is
  # offered one only when config/packages.yaml has exactly one for it.
  orderable: true

monitoring:
  monthly_net: 1200
  yearly_net: 12000
  # P4 builds the alerts; until then the price is shown as coming.
  available: false
  # Days before a period ends that the renewal proforma is issued (P6 s79). More than
  # invoicing.yaml's proforma_due_days, so the proforma falls due before the period ends.
  renewal_notice_days: 10
