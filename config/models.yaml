# Task → model routing for app/ai/gateway.py (docs/architecture.md §3.4).
#
# The model and prompt version are both part of the cache key, so changing
# either here recomputes every cached answer for that task on its next use.
# Changing a prompt means a NEW version file in prompts/<task>/ and an
# evaluation run (CLAUDE.md); never edit a version file that has run.
#
# Tasks are added together with their prompt:
#   extract_call      P1 s10
#   verify_criterion  P2 s29
#   compose_report    P2 s32

# USD per million tokens, Anthropic list prices as of 13.09.2026. Used only to
# fill model_call.cost_usd; the provider's invoice is the authority.
pricing_usd_per_mtok:
  claude-opus-5: {input: 5.00, output: 25.00}
  claude-sonnet-5: {input: 2.00, output: 10.00}
  claude-haiku-4-5: {input: 1.00, output: 5.00}

tasks:
  # Brief §7 asks for the cheapest tier for extraction. Sonnet rather than Haiku:
  # extraction decides which conditions can exclude an applicant and must copy
  # Macedonian quotes verbatim, and it runs once per changed document, so the
  # difference is cents a month. Revisit with the evaluation harness (P2).
  extract_call:
    model: claude-sonnet-5
    prompt_version: "2026-09-13.1"
    max_tokens: 16000

# Embeddings for retrieval (app/retrieval/embedder.py, P1 s12). Not a task: the
# model runs locally on CPU, so no text leaves the machine, there is no provider,
# no cost row and no scrubbing to do.
#
# Chosen on 16.09.2026 over paraphrase-multilingual-MiniLM-L12-v2 and
# paraphrase-multilingual-mpnet-base-v2 with 26 hand-written Macedonian
# paraphrase queries over the three extraction fixtures: the only one of the
# three that kept every clause in the top 3 at 900-character chunks. ~2.2 GB on
# disk, ~1.5 GB of memory while loaded, MIT licence (docs/architecture.md §3.1).
#
# `dimensions` must equal the chunk.embedding column; a different model means a
# migration. Changing `model` re-embeds every chunk on the next index run, and
# retrieval ignores vectors from any other model until then.
embedding:
  model: intfloat/multilingual-e5-large
  dimensions: 1024
  # E5 was trained with these prefixes; without them, ranking gets worse.
  query_prefix: "query: "
  passage_prefix: "passage: "
