# How invoices are numbered and when a proforma falls due (roadmap P4 s48–49).
#
# PROVISIONAL: the numbering scheme must match what the accountant already files
# (docs/decisions.md D4). Confirm it before the first real invoice; changing it after
# one is issued means a new fiscal year or a conversation with the accountant.

# Numbers are gapless per kind and fiscal year: {prefix}-{year}-{n:04d}.
prefixes:
  proforma: ПФ
  final: Ф

# Days a proforma stays payable. After that the order may be cancelled; nothing is
# cancelled automatically.
proforma_due_days: 8

# The seller's fiscal details on every proforma and invoice (P4 s49). The name, address and
# ЕМБС are config/legal.yaml's `entity` (written once); these are the rest. Unknown until D4
# is confirmed with the accountant; `flask invoices check` fails while any is missing, and an
# undecided field prints as «[се утврдува]».
seller:
  edb: null           # ЕДБ, with the MK prefix if VAT-registered (МК4030…)
  bank_account: null  # жиро сметка, 15 digits
  bank: null          # the bank's name
  place: Скопје       # place of issue
