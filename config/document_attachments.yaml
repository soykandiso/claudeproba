# What an applicant may have to attach, said once (roadmap P5 s57). A template's manifest
# (<version>.yaml beside its .docx) names the ones its call asks for, by key, and may add a
# note: how old a certificate may be, how many offers, a notary's stamp. The checklist
# (app/documents/checklist.py) prints the label, then how to obtain it, then the note.
#
# The `how_mk` texts are Claude's drafts: a native reader checks them before a package is
# sold, as every customer-facing Macedonian text (CLAUDE.md). They say where a document comes
# from, never how long it takes or what it costs: that changes, and is not ours to promise.

attachments:
  tekovna_sostojba:
    label_mk: "Тековна состојба на субјектот"
    how_mk: "Се добива од Централниот регистар на Република Северна Македонија, на шалтер или електронски."
  ujp_potvrda:
    label_mk: "Потврда за платени даноци и придонеси"
    how_mk: "Се добива од Управата за јавни приходи, електронски или на шалтер."
  godishna_smetka:
    label_mk: "Годишна сметка за претходната година"
    how_mk: "Ја подготвува вашиот сметководител; поднесената годишна сметка се добива и од Централниот регистар."
  bankarska_potvrda:
    label_mk: "Потврда од банката за отворена трансакциска сметка"
    how_mk: "Се добива од банката во која е отворена сметката."
  ponudi:
    label_mk: "Понуди или профактури од добавувачите"
    how_mk: "Ги добивате од добавувачите на опремата или услугите за кои барате средства."
  vraboteni_potvrda:
    label_mk: "Потврда за бројот на вработени"
    how_mk: "Ја издава институцијата што ја наведува повикот; прочитајте во повикот која."
  licna_karta_odgovorno:
    label_mk: "Копија од личната карта на одговорното лице"
    how_mk: "Копија од важечка лична карта или пасош."
  ovlastuvanje:
    label_mk: "Овластување, ако барањето го потпишува друго лице"
    how_mk: "Писмено овластување од одговорното лице на субјектот."
  # -- added with the Ministry of Economy's forms (P5 s62)
  stecaj_potvrda:
    label_mk: "Потврда дека не е отворена стечајна постапка"
    how_mk: "Се добива од Централниот регистар на Република Северна Македонија."
  likvidacija_potvrda:
    label_mk: "Потврда дека не е отворена ликвидациона постапка"
    how_mk: "Се добива од Централниот регистар на Република Северна Македонија."
  ekonomsko_finansiska_informacija:
    label_mk: "Информација за економско-финансиската состојба на субјектот"
    how_mk: "Се добива од Централниот регистар на Република Северна Македонија."
  av_lista_vraboteni:
    label_mk: "Листа или доказ за вработените лица"
    how_mk: "Ја издава Агенцијата за вработување на Република Северна Македонија."
  zanaetciska_dozvola:
    label_mk: "Занаетчиска дозвола (само за занаетчии)"
    how_mk: "Ја издава надлежната занаетчиска комора."
  fakturi:
    label_mk: "Фактури за направените трошоци"
    how_mk: "Ги издава добавувачот, изведувачот или сертификациското тело."
  izvod_plakanje:
    label_mk: "Извод од банката или SWIFT за платените фактури"
    how_mk: "Се добива од вашата банка."
  dogovor_izveduvac:
    label_mk: "Договор со изведувачот или сертификациското тело"
    how_mk: "Договорот што го склучивте за услугата за која барате надомест."
  sertifikat_izvestaj:
    label_mk: "Сертификат или извештај од сертификациското тело"
    how_mk: "Го издава сертификациското тело или телото за оценување."
  izvestaj_proekt:
    label_mk: "Извештај за реализираниот проект со индикатори за успешност"
    how_mk: "Го подготвувате според упатството што Министерството го објавува со повикот."
  dokaz_godina_masina:
    label_mk: "Доказ за годината на производство на набавената машина"
    how_mk: "Фотографија, спецификација или декларација на машината."
  kopija_ziro_smetka:
    label_mk: "Копија од трансакциската сметка"
    how_mk: "Се добива од вашата банка."
  administrativna_taksa:
    label_mk: "Уплатници за административните такси"
    how_mk: "Се уплатуваат во банка или пошта; износите и сметките се наведени во барањето."
  notarska_zaverka:
    label_mk: "Заверка на изјавите кај нотар"
    how_mk: "Изјавите од пакетот ги потпишува одговорното лице пред нотар."
