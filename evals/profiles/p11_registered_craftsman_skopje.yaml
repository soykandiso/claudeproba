name: Филигранџија, занаетчија во Чаир, основан 2013
boundary: >
  Истиот филигранџија како p07, но упишан во Регистарот на занаетчии наместо
  трговец поединец — единствената разлика е обликот. Повикот на Град Скопје е
  за занаетчии, а повикот на Министерството за економија ги ослободува
  занаетчиите од условите за дејност и за двајца вработени, па овој профил
  мери дали обликот стигнува до пресудата.
