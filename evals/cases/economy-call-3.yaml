# Јавен повик за финансиска поддршка на микро, мали и средни претпријатија и занаетчии
# Министерство за економија и труд · https://www.economy.gov.mk/mk-MK/javni-objavi/javni-oglasi/javen-povik-za-finansiska-poddrska-na-mikro-mali-i-sredni-pretprijatija-i-zanaetcii
# Рок: 30.06.2026 · состојба: open
# Целиот текст: evals/fixtures/economy-call-3/document.txt
#
# Условите на повикот, онака како се одобрени, со неговите зборови:
#   [hard_structured] Најмалку 12 месеци работење пред објавувањето на повикот
#       „Работење во траење од најмалку 12 (дванаесет) месеци пред објавувањето на јавниот
#       повик;“
#   [hard_structured] Големи претпријатија немаат право на учество
#       „Микро, мали и средни претпријатија со мнозински домашен капитал (над 50%)“
#   [applicant_attest] Мнозински домашен капитал (над 50%)
#       „Микро, мали и средни претпријатија со мнозински домашен капитал (над 50%)“
#   [applicant_attest] Активен субјект без стечајна постапка или ликвидација
#       „Имаат статус на активен деловен субјект над кој не е покрената стечајна постапка или
#       ликвидација;“
#   [applicant_attest] Позитивен финансиски резултат во 2025 година
#       „Имаат остварено позитивен финансиски резултат во 2025 година;“
#   [applicant_attest] Помош од мало значење под 300.000 евра во последните три фискални години
#       „Не го надминале максималниот дозволен износ од 300.000 евра на вкупно добиена помош за
#       период од три последни фискални години“
#   [narrative_verify] За претпријатија: претежна дејност во Преработувачка индустрија (10-33.20)
#       „Вршат претежна дејност наведена во Тековната состојба од ЦРРСМ, која спаѓа во секторот
#       C/B - Преработувачка индустрија (10-33.20)“
#   [narrative_verify] За претпријатија: најмалку 2 вработени на неопределено време
#       „Имаат минимум 2 (двајца) вработени на неопределено работно време, пред датумот на
#       објавување на јавниот повик.“
#   [documentary] Образец „Барање – ММСП/З 2026“
#       „Пополнет Образец „Барање – ММСП/З 2026““
#   [documentary] Уверение од УЈП за платени даноци и придонеси, не постаро од 6 месеци
#       „Уверение за состојба на даноци, придонеси и други јавни приходи и давачки од Управата
#       за јавни приходи на Република Северна Македонија, не постаро од 6 (шест) месеци;“
#
# За секој профил впишете еден од: eligible, likely_eligible,
# needs_verification, not_eligible, not_shown — и една реченица зошто.
# Се пишува вистинскиот одговор, не она што системот денес го кажува.

