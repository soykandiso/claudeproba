# Претходна најава за објавување на Јавен повик 03/2025 (ИПАРД Програма 2021-2027)
# Агенција за финансиска поддршка во земјоделството (ИПАРД) · https://www.ipardpa.gov.mk/mk/Home/IpardPovici/34
# Рок: нема · состојба: announced
# Целиот текст: evals/fixtures/ipard-notice-03-2025/document.txt
#
# Условите на повикот, онака како се одобрени, со неговите зборови:
#   [narrative_verify] Инвестицијата спаѓа во мерка 7 – Диверзификација на фарми и развој на бизниси
#       „Мерка 7 - Диверзификација на фарми и развој на бизниси и тоа следните приоритетни
#       сектори:“
#   [narrative_verify] Поддржан сектор: алтернативно земјоделско производство
#       „Aлтернативно земјоделско производство (кое не е поддржано според мерките 1 и 3)“
#   [narrative_verify] Повикот трае 45 дена од објавувањето во дневните весници
#       „Јавниот повик ќе трае 45 дена од денот на објавување во дневните весници.“
#
# За секој профил впишете еден од: eligible, likely_eligible,
# needs_verification, not_eligible, not_shown — и една реченица зошто.
# Се пишува вистинскиот одговор, не она што системот денес го кажува.

call: ipard-notice-03-2025
cases:
  # Земјоделско стопанство во Струмица, основано 2020
  #   Вид на субјект: Земјоделско стопанство
  #   Дејност: 01.13 Одгледување на зеленчук, дињи и лубеници, коренест и трупкаст зеленчук
  #   Седиште: Струмица, Југоисточен регион
  #   Старост: 65–77 месеци, основана 2020
  #   Вработени: 2–9
  #   Годишен промет: до 10 милиони МКД
  #   Намена: опрема и машини, енергетска ефикасност
  #   Износ на инвестицијата: 3–10 милиони МКД
  #   Сопствено учество: 35%
  #   Рок на проектот: 18 месеци
  - profile: p09_strumica_farm
    expect: needs_verification
    reason: "Најавата е за мерка 7 (диверзификација), а одгледувањето зеленчук се поддржува по мерка 1; повикот сè уште не е објавен."
