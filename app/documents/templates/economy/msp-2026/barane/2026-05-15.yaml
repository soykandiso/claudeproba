fill_by_hand_mk: 'Во барањето: како е регистриран субјектот (микро, мало, средно претпријатие или занаетчија),
  краткиот опис на дејноста, описот на направените трошоци и ознаките ✓ за приложената документација'
package_note_mk: Барањето со прилозите се доставува до Министерството за економија и труд, како што е
  наведено во повикот. Проверете ја последната верзија на повикот пред да поднесете.
