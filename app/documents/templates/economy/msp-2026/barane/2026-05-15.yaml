title_mk: Барање за финансиска поддршка на микро, мали и средни претпријатија и занаетчии
source_url: https://portal.mdt.gov.mk/post-body-files/javen-povik-za-finansiska-poddrska-na-mikro-mali-i-sredni-pretprijatija-i-zanaetcii-file-tMVR.doc
