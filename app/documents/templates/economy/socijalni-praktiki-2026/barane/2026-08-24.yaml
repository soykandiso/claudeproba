fill_by_hand_mk: 'Во барањето: главните производи и услуги, продажбата за 2025 и проекцијата за 2026,
  сертификациското тело, видот на сертификација (само еден), датумот на договорот и трошоците во денари'
package_note_mk: Барањето со прилозите се доставува до Министерството за економија и труд, како што е
  наведено во повикот. Проверете ја последната верзија на повикот пред да поднесете.
